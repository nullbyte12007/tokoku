{% extends "base.html" %}
{% from "_macros.html" import csrf %}

{% block title %}Ubah password — Tokoku{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Ubah password</h1>
  <p class="muted">Minimal {{ min_password }} karakter. Setelah diubah, pakai password baru untuk masuk berikutnya.</p>

  <form method="post" class="stack">
    {{ csrf() }}
    <label>
      Password saat ini
      <input type="password" name="current_password" required
             autocomplete="current-password" autofocus>
    </label>
    <label>
      Password baru
      <input type="password" name="new_password" required minlength="{{ min_password }}"
             autocomplete="new-password">
    </label>
    <label>
      Ulangi password baru
      <input type="password" name="new_password2" required minlength="{{ min_password }}"
             autocomplete="new-password">
    </label>
    <button class="btn" type="submit">Simpan password baru</button>
  </form>

  <p class="muted small"><a href="{{ url_for('auth.account') }}">← Kembali ke akun</a></p>
</div>
{% endblock %}
