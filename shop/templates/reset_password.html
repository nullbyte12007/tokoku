{% extends "base.html" %}
{% from "_macros.html" import csrf %}

{% block title %}Atur ulang password — Tokoku{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Atur ulang password</h1>
  <p class="muted">Masukkan password baru untuk akunmu.</p>

  <form method="post" class="stack" autocomplete="off">
    {{ csrf() }}
    <label>
      Password baru
      <input type="password" name="new_password" required minlength="8"
             autocomplete="new-password" autofocus>
      <span class="muted small">Minimal 8 karakter.</span>
    </label>
    <label>
      Ulangi password baru
      <input type="password" name="new_password2" required minlength="8"
             autocomplete="new-password">
    </label>
    <button class="btn" type="submit">Simpan password baru</button>
  </form>

  <p class="muted small">
    <a href="{{ url_for('auth.login') }}">← Kembali ke halaman masuk</a>
  </p>
</div>
{% endblock %}
