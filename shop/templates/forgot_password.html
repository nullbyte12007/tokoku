{% extends "base.html" %}
{% from "_macros.html" import csrf %}

{% block title %}Lupa password — Tokoku{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Lupa password</h1>
  <p class="muted">
    Masukkan email akunmu. Kami akan mengirim tautan untuk mengatur ulang password.
  </p>

  <form method="post" class="stack" autocomplete="off">
    {{ csrf() }}
    <label>
      Email
      <input type="email" name="email" value="{{ email }}" required autocomplete="email" autofocus>
    </label>

    <label>
      Berapa {{ captcha_question }}?
      <input type="text" name="captcha" inputmode="numeric" required
             autocomplete="off" placeholder="jawaban">
    </label>
    <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button class="btn" type="submit">Kirim tautan reset</button>
  </form>

  <p class="muted small">
    <a href="{{ url_for('auth.login') }}">← Kembali ke halaman masuk</a>
  </p>
</div>
{% endblock %}
